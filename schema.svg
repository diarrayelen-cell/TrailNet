<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="titre desc">
  <title id="titre">Schéma du prototype TrailNet</title>
  <desc id="desc">Micro, PC 1 (Whisper ou Codec2), carte LoRa A, liaison radio LoRa 868 MHz chiffrée, carte LoRa B, PC 2 (affichage, voix de synthèse, lecture des notes), haut-parleur. Aucun serveur, aucune carte SIM, aucun internet.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
    .titre { font-size: 26px; font-weight: 700; }
    .sous { font-size: 16px; fill: #57606a; }
    .boite { font-size: 20px; font-weight: 700; }
    .ligne { font-size: 15px; fill: #424a53; }
    .petit { font-size: 13px; fill: #57606a; }
    .radio { font-size: 16px; font-weight: 700; fill: #1d4ed8; }
    .bas { font-size: 16px; fill: #1f2328; font-weight: 600; }
  </style>

  <!-- fond clair, lisible aussi en thème sombre -->
  <rect x="1" y="1" width="1278" height="418" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text class="titre" x="40" y="54">TrailNet — prototype</text>
  <text class="sous" x="40" y="80">Tu parles au PC 1, ta phrase ou ta note vocale part par radio LoRa, le PC 2 l'affiche et la dit.</text>

  <!-- micro -->
  <g transform="translate(80 205)">
    <rect x="-13" y="-38" width="26" height="46" rx="13" fill="#e7ecf2" stroke="#57606a" stroke-width="2.5"/>
    <path d="M-22 -6 a22 22 0 0 0 44 0" fill="none" stroke="#57606a" stroke-width="2.5"/>
    <line x1="0" y1="16" x2="0" y2="32" stroke="#57606a" stroke-width="2.5"/>
    <line x1="-12" y1="32" x2="12" y2="32" stroke="#57606a" stroke-width="2.5"/>
  </g>
  <text class="petit" x="80" y="268" text-anchor="middle">ta voix</text>
  <line x1="112" y1="200" x2="160" y2="200" stroke="#57606a" stroke-width="2.5" marker-end="url(#fleche)"/>

  <!-- PC 1 -->
  <rect x="165" y="120" width="240" height="160" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text class="boite" x="185" y="153">PC 1</text>
  <text class="ligne" x="185" y="185">Whisper : voix → texte</text>
  <text class="ligne" x="185" y="210">ou Codec2 : note vocale</text>
  <text class="ligne" x="185" y="235">tu relis, tu corriges</text>
  <text class="petit" x="185" y="262">tout reste sur le PC</text>

  <line x1="405" y1="200" x2="445" y2="200" stroke="#57606a" stroke-width="2.5" marker-end="url(#fleche)"/>
  <text class="petit" x="425" y="190" text-anchor="middle">USB</text>

  <!-- carte A -->
  <line x1="575" y1="120" x2="575" y2="92" stroke="#57606a" stroke-width="3"/>
  <circle cx="575" cy="89" r="4" fill="#57606a"/>
  <rect x="450" y="120" width="150" height="160" rx="12" fill="#eef4ff" stroke="#6b8fd6" stroke-width="2"/>
  <text class="boite" x="468" y="153">Carte A</text>
  <text class="ligne" x="468" y="185">Heltec V3</text>
  <text class="ligne" x="468" y="210">Meshtastic</text>
  <text class="petit" x="468" y="262">la radio, rien de plus</text>

  <!-- liaison radio -->
  <g fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round">
    <path d="M622 172 q10 28 0 56"/>
    <path d="M640 160 q16 40 0 80"/>
    <path d="M658 148 q22 52 0 104"/>
    <path d="M738 172 q-10 28 0 56"/>
    <path d="M720 160 q-16 40 0 80"/>
    <path d="M702 148 q-22 52 0 104"/>
  </g>
  <text class="radio" x="680" y="128" text-anchor="middle">LoRa 868 MHz</text>
  <text class="petit" x="680" y="290" text-anchor="middle">chiffré · ≈ 1 kbit/s</text>
  <text class="petit" x="680" y="308" text-anchor="middle">plusieurs km</text>

  <!-- carte B -->
  <line x1="785" y1="120" x2="785" y2="92" stroke="#57606a" stroke-width="3"/>
  <circle cx="785" cy="89" r="4" fill="#57606a"/>
  <rect x="760" y="120" width="150" height="160" rx="12" fill="#eef4ff" stroke="#6b8fd6" stroke-width="2"/>
  <text class="boite" x="778" y="153">Carte B</text>
  <text class="ligne" x="778" y="185">Heltec V3</text>
  <text class="ligne" x="778" y="210">Meshtastic</text>
  <text class="petit" x="778" y="262">accusé de réception</text>

  <line x1="910" y1="200" x2="950" y2="200" stroke="#57606a" stroke-width="2.5" marker-end="url(#fleche)"/>
  <text class="petit" x="930" y="190" text-anchor="middle">USB</text>

  <!-- PC 2 -->
  <rect x="955" y="120" width="240" height="160" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text class="boite" x="975" y="153">PC 2</text>
  <text class="ligne" x="975" y="185">affiche le message</text>
  <text class="ligne" x="975" y="210">le lit à voix haute</text>
  <text class="ligne" x="975" y="235">joue la note vocale</text>
  <text class="petit" x="975" y="262">voix de Windows, hors ligne</text>

  <!-- haut-parleur -->
  <line x1="1195" y1="200" x2="1213" y2="200" stroke="#57606a" stroke-width="2.5"/>
  <g transform="translate(1222 200)" fill="none" stroke="#57606a" stroke-width="2.5" stroke-linejoin="round">
    <path d="M0 -9 h10 l14 -13 v44 l-14 -13 h-10 z" fill="#e7ecf2"/>
    <path d="M32 -10 q8 10 0 20"/>
    <path d="M38 -18 q14 18 0 36"/>
  </g>

  <!-- bandeau -->
  <rect x="40" y="340" width="1200" height="48" rx="10" fill="#f0fdf4" stroke="#86c99a" stroke-width="1.5"/>
  <text class="bas" x="640" y="370" text-anchor="middle">Aucun serveur · aucune carte SIM · aucun internet : tout se passe sur les PC et par radio</text>
</svg>
