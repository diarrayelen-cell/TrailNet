<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Schéma du prototype TrailNet</title>
  <desc id="d">Le PC 1 transcrit la voix en texte et l'envoie par USB à la carte A. La carte A l'émet par radio LoRa 868 MHz sur un canal privé chiffré. La carte B le reçoit et le transmet par USB au PC 2, qui l'affiche et le lit à voix haute. Un téléphone peut aussi être relié à la carte B en Bluetooth.</desc>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AB0BD"/>
    </marker>
  </defs>
  <rect width="1200" height="470" rx="18" fill="#0B0B0C"/>

  <!-- PC 1 -->
  <rect x="30" y="70" width="260" height="230" rx="14" fill="#16181B" stroke="#2C3238" stroke-width="2"/>
  <text x="54" y="108" font-size="24" font-weight="700" fill="#F2F4F5">PC 1 · dicter</text>
  <text x="54" y="146" font-size="18" fill="#C9D3D9">1. tu parles au micro</text>
  <text x="54" y="176" font-size="18" fill="#C9D3D9">2. Whisper transcrit,</text>
  <text x="74" y="200" font-size="18" fill="#C9D3D9">sur le PC, hors ligne</text>
  <text x="54" y="230" font-size="18" fill="#C9D3D9">3. tu relis, tu corriges</text>
  <text x="54" y="270" font-size="16" fill="#F2A65A" font-family="Consolas, Menlo, monospace">≈ 150 octets de texte</text>

  <!-- USB 1 -->
  <line x1="292" y1="185" x2="352" y2="185" stroke="#9AB0BD" stroke-width="2.5" marker-end="url(#fl)"/>
  <text x="322" y="172" font-size="14" fill="#9AB0BD" text-anchor="middle" font-family="Consolas, Menlo, monospace">USB</text>

  <!-- Carte A -->
  <rect x="356" y="125" width="180" height="120" rx="12" fill="#16181B" stroke="#F2A65A" stroke-width="2"/>
  <text x="446" y="168" font-size="22" font-weight="700" fill="#F2F4F5" text-anchor="middle">Carte A</text>
  <text x="446" y="196" font-size="15" fill="#C9D3D9" text-anchor="middle">Heltec V3 · LoRa</text>
  <text x="446" y="220" font-size="15" fill="#C9D3D9" text-anchor="middle">Meshtastic</text>

  <!-- Radio -->
  <g fill="none" stroke="#F2A65A" stroke-width="2.5" stroke-linecap="round">
    <path d="M552,165 q12,20 0,40"/><path d="M566,155 q20,30 0,60"/><path d="M580,145 q28,40 0,80"/>
    <path d="M648,165 q-12,20 0,40"/><path d="M634,155 q-20,30 0,60"/><path d="M620,145 q-28,40 0,80"/>
  </g>
  <text x="600" y="98" font-size="17" font-weight="700" fill="#F2A65A" text-anchor="middle">radio 868 MHz</text>
  <text x="600" y="270" font-size="15" fill="#C9D3D9" text-anchor="middle">canal privé chiffré</text>
  <text x="600" y="292" font-size="15" fill="#C9D3D9" text-anchor="middle">1 paquet · ≈ 1,5 s d'antenne</text>

  <!-- Carte B -->
  <rect x="664" y="125" width="180" height="120" rx="12" fill="#16181B" stroke="#F2A65A" stroke-width="2"/>
  <text x="754" y="168" font-size="22" font-weight="700" fill="#F2F4F5" text-anchor="middle">Carte B</text>
  <text x="754" y="196" font-size="15" fill="#C9D3D9" text-anchor="middle">affiche le message</text>
  <text x="754" y="220" font-size="15" fill="#C9D3D9" text-anchor="middle">renvoie l'accusé</text>

  <!-- USB 2 -->
  <line x1="846" y1="185" x2="906" y2="185" stroke="#9AB0BD" stroke-width="2.5" marker-end="url(#fl)"/>
  <text x="876" y="172" font-size="14" fill="#9AB0BD" text-anchor="middle" font-family="Consolas, Menlo, monospace">USB</text>

  <!-- PC 2 -->
  <rect x="910" y="70" width="260" height="230" rx="14" fill="#16181B" stroke="#2C3238" stroke-width="2"/>
  <text x="934" y="108" font-size="24" font-weight="700" fill="#F2F4F5">PC 2 · écouter</text>
  <text x="934" y="146" font-size="18" fill="#C9D3D9">4. le message s'affiche</text>
  <text x="934" y="176" font-size="18" fill="#C9D3D9">5. la voix de l'ordinateur</text>
  <text x="954" y="200" font-size="18" fill="#C9D3D9">le lit à voix haute,</text>
  <text x="954" y="224" font-size="18" fill="#C9D3D9">hors ligne</text>

  <!-- Téléphone -->
  <line x1="754" y1="247" x2="754" y2="330" stroke="#9AB0BD" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#fl)"/>
  <text x="766" y="296" font-size="14" fill="#9AB0BD" font-family="Consolas, Menlo, monospace">Bluetooth</text>
  <rect x="664" y="334" width="180" height="66" rx="12" fill="#16181B" stroke="#2C3238" stroke-width="2"/>
  <text x="754" y="362" font-size="17" font-weight="700" fill="#F2F4F5" text-anchor="middle">Téléphone</text>
  <text x="754" y="386" font-size="14" fill="#C9D3D9" text-anchor="middle">(option) app Meshtastic</text>

  <text x="600" y="440" font-size="17" fill="#9AB0BD" text-anchor="middle">Rien ne passe par internet : ni serveur, ni carte SIM, ni compte.</text>
</svg>
